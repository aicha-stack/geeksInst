{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto">
  <div class="card-professional overflow-hidden">
    <!-- Image Section -->
    <div class="relative h-[500px] bg-gradient-to-br from-blue-50 via-indigo-50 to-gray-100">
      {% if car.image_url %}
      <img src="{{ car.image_url }}" alt="{{ car.model }}" class="w-full h-full object-cover">
      {% else %}
      <div class="flex items-center justify-center h-full">
        <div class="text-center">
          <i class="fas fa-car text-gray-300 text-9xl mb-4"></i>
          <p class="text-gray-400 text-lg">No image available</p>
        </div>
      </div>
      {% endif %}
      <div class="absolute top-6 right-6 badge-professional text-lg px-6 py-3">
        ${{ "%.0f"|format(car.price|float) }}
      </div>
    </div>

    <!-- Details Section -->
    <div class="p-8 lg:p-10">
      <div class="mb-8">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 tracking-tight">{{ car.model }}</h1>
        <div class="flex flex-wrap items-center gap-6">
          <div class="flex items-center bg-blue-500/20 px-4 py-2.5 rounded-lg border border-blue-500/30">
            <i class="fas fa-calendar-alt text-blue-400 mr-3 text-lg"></i>
            <span class="font-semibold text-gray-200">Year {{ car.year }}</span>
          </div>
          <div class="flex items-center bg-slate-700/50 px-4 py-2.5 rounded-lg border border-slate-600/50">
            <i class="fas fa-tag text-slate-400 mr-3 text-lg"></i>
            <span class="font-semibold text-gray-200">ID: #{{ car.id }}</span>
          </div>
        </div>
      </div>

      <div class="border-t border-gray-700/50 pt-8 mb-8">
        <div class="flex items-center mb-4">
          <div class="bg-blue-500/20 p-2 rounded-lg mr-3 border border-blue-500/30">
            <i class="fas fa-info-circle text-blue-400"></i>
          </div>
          <h2 class="text-2xl font-bold text-white">Description</h2>
        </div>
        <p class="text-gray-300 leading-relaxed text-lg pl-12">{{ car.description }}</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap gap-3 pt-6 border-t border-gray-700/50">
        <a href="{{ url_for('index') }}" 
           class="btn-secondary flex items-center">
          <i class="fas fa-arrow-left mr-2"></i>Back to List
        </a>
        <a href="{{ url_for('edit', car_id=car.id) }}" 
           class="btn-primary flex items-center">
          <i class="fas fa-edit mr-2"></i>Edit Vehicle
        </a>
        <a href="{{ url_for('delete_car', car_id=car.id) }}"
           class="bg-red-900/30 text-red-300 px-6 py-3 rounded-lg hover:bg-red-900/50 transition font-semibold border border-red-500/30 flex items-center"
           onclick="return confirm('Are you sure you want to delete this vehicle? This action cannot be undone.');">
          <i class="fas fa-trash mr-2"></i>Delete Vehicle
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
