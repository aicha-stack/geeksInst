<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ffe6f7 0%, #f9c6ff 100%);
            color: #a64ca6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }
        body::before {
            width: 180px; height: 180px;
            left: 40px; top: 40px;
            background: radial-gradient(circle at 60% 40%, #ffb6d5 60%, #fff0f6 100%);
            box-shadow: 0 0 60px 20px #ffb6d5;
        }
        body::after {
            width: 120px; height: 120px;
            right: 60px; bottom: 60px;
            background: radial-gradient(circle at 40% 60%, #ffe066 60%, #fffbe6 100%);
            box-shadow: 0 0 40px 10px #ffe066;
        }
        
        .butterfly {
            position: absolute;
            width: 60px; height: 60px;
            background: url('https://img.icons8.com/color/96/butterfly.png') no-repeat center/contain;
            z-index: 1;
            opacity: 0.8;
            animation: flutter 6s infinite alternate;
        }
        .butterfly.b1 { top: 20%; left: 10%; animation-delay: 0s;}
        .butterfly.b2 { top: 70%; left: 80%; animation-delay: 2s;}
        .butterfly.b3 { top: 50%; left: 50%; animation-delay: 1s;}
        @keyframes flutter {
            0% { transform: translateY(0) scale(1);}
            50% { transform: translateY(-20px) scale(1.1);}
            100% { transform: translateY(0) scale(1);}
        }
        form {
            background: rgba(255, 255, 255, 0.95);
            padding: 28px 36px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(246, 124, 205, 0.25);
            width: 370px;
            position: relative;
            z-index: 2;
            border: 2px dashed #f39bff;
        }
        label {
            color: #d94fc8;
            font-weight: bold;
            font-size: 1.05em;
            margin-bottom: 3px;
            display: block;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            margin: 10px 0 18px 0;
            border-radius: 8px;
            border: 1.5px solid #f39bff;
            background: #fff0fa;
            font-size: 1em;
            color: #a64ca6;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: #d94fc8;
            outline: none;
        }
        button {
            padding: 12px 0;
            border: none;
            background: linear-gradient(90deg, #f39bff 0%, #c751eb 100%);
            color: #fff;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(246, 124, 205, 0.15);
            transition: background 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #c751eb 0%, #f39bff 100%);
        }
        p#result {
            margin-top: 18px;
            font-weight: bold;
            color: #d94fc8;
            font-size: 1.15em;
            text-align: center;
            background: #fff0fa;
            border-radius: 8px;
            padding: 8px 0;
            box-shadow: 0 1px 4px rgba(246, 124, 205, 0.08);
        }
    </style>
</head>
<body>
    <div class="butterfly b1"></div>
    <div class="butterfly b2"></div>
    <div class="butterfly b3"></div>
    <form id="currencyForm">
        <label for="amount">Montant :</label>
        <input type="number" id="amount" required placeholder="Entrez le montant">

        <label for="fromCurrency">De :</label>
        <select id="fromCurrency"></select>

        <label for="toCurrency">À :</label>
        <select id="toCurrency"></select>

        <button type="submit">Convertir</button>
        <p id="result"></p>
    </form>

    <script>
        const fromSelect = document.getElementById("fromCurrency");
        const toSelect = document.getElementById("toCurrency");
        const apiKey = '181ce9d8a43e5931d6977c00'

        const loadCurrencies = async () => {
                try {

                        const res = await fetch(`https://v6.exchangerate-api.com/v6/${apiKey}/codes`);
                        const data = await res.json();
                        const currencies = data.supported_codes;
                        console.log(data);
                        currencies.forEach(([code, name]) => {
                                const option1 = document.createElement("option");
                                option1.value = code;
                                option1.textContent = `${code} - ${name}`;
                                fromSelect.appendChild(option1);

                                const option2 = document.createElement("option");
                                option2.value = code;
                                option2.textContent = `${code} - ${name}`;
                                toSelect.appendChild(option2);
                        });
                } catch (error) {
                        console.error("Error fetching currencies:", error);
                }
        }

        loadCurrencies()
        async function convertCurrency(event) {
                event.preventDefault();
                const amount = document.getElementById("amount").value;
                const resultParagraph = document.getElementById("result");
                const from = fromSelect.value;
                const to = toSelect.value;

            try {
                const response = await fetch(`https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amount}`);
                const data = await response.json();
             
                if (data) {
                    resultParagraph.textContent = `${amount} `;
                } else {
                    resultParagraph.textContent = "Conversion échouée !";
                }
            } catch (error) {
                resultParagraph.textContent = "Erreur lors de la conversion !";
                console.log(error);
            }
        }

        document.getElementById("currencyForm").addEventListener("submit", convertCurrency);
    </script>
</body>
</html>
