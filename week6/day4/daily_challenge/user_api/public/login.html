<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffe6f2 0%, #ffd6ec 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            max-width: 350px;
            margin: 60px auto;
            background: #fff0fa;
            padding: 32px 28px;
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(255, 182, 193, 0.18);
            border: 2px solid #ffb6d5;
        }
        h2 {
            text-align: center;
            margin-bottom: 22px;
            color: #d63384;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            color: #c2185b;
            font-size: 1rem;
            font-weight: 500;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1.5px solid #ffb6d5;
            border-radius: 8px;
            box-sizing: border-box;
            background: #fff;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #d63384;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ffb6d5 0%, #d63384 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(255,182,193,0.15);
        }
        button:enabled {
            opacity: 1;
            box-shadow: 0 4px 12px rgba(214,51,132,0.12);
        }
        button:active {
            background: linear-gradient(90deg, #d63384 0%, #ffb6d5 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Username" required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="submit" disabled>Login</button>
        </form>
    </div>
    
</body>
<script>
        const form = document.getElementById('loginForm');
        const btn = form.querySelector('button');
        form.addEventListener('input', () => {
            btn.disabled = ![...form.elements].every(e => e.value);
        });
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());
            const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(data) });
            const json = await res.json();
            alert(JSON.stringify(json));
        });
    </script>
</html>
